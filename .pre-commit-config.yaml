repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-merge-conflict
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: mixed-line-ending
      - id: debug-statements

  # The revision matches the dev pin of Ruff (pyproject.toml).
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.11.13
    hooks:
      - id: ruff
        args: ["--fix"]
      - id: ruff-format

  # Pyright needs the compiled extension _netgraph_core to resolve the package's imports, so it
  # runs as make lint runs it: the pinned Pyright of the project's venv (make dev), whose
  # interpreter has the extension built, over the whole project (pyproject.toml's settings).
  # An isolated hook environment cannot hold the extension.
  - repo: local
    hooks:
      - id: pyright
        name: pyright
        entry: venv/bin/python -m pyright --pythonpath venv/bin/python
        language: system
        types_or: [python, pyi]
        pass_filenames: false
