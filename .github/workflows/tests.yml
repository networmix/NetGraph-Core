name: Tests

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

# Every job installs its Python tools with the pins of .github/ci-constraints.txt, pip itself
# first. An editable install builds the package in an isolated environment of pip's own, which
# since pip 26.2 takes only build constraints (--build-constraint), never -c: both name the same
# file.
jobs:
  test:
    name: Unit tests (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        include:
          # Free-threaded CPython (no GIL): the module declares py::mod_gil_not_used().
          - os: ubuntu-22.04
            python-version: "3.14t"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # bash on every OS: PowerShell would not stop when the first command fails.
      - name: Install deps
        shell: bash
        run: |
          python -m pip install -U -c .github/ci-constraints.txt pip
          python -m pip install -c .github/ci-constraints.txt --build-constraint .github/ci-constraints.txt -e ".[dev]"
      - name: Run CI checks (lint + C++ tests with and without the hooks + Python tests)
        if: runner.os != 'Windows'
        run: make check-ci
      # Windows runs the Python tests through the guard dev/run-checks.sh uses, without the shell
      # script: the editable build must carry the private hooks and no test may skip.
      - name: Run Python tests (Windows)
        if: runner.os == 'Windows'
        run: python dev/pytest_guard.py on tests/py -v
      # The timing tool of dev/perf compiles against the library (its adapter uses the public
      # API and two private functions of the queue rule), and nothing else builds it: its own
      # tests, which compile its driver with this checkout's library, run on one job, so a
      # library change that breaks the tool fails here. macOS: the platform the tool is made
      # and checked on (its build record and memory reading are macOS-first).
      - name: Timing tool tests (macOS, py3.14)
        if: runner.os == 'macOS' && matrix.python-version == '3.14'
        run: make perf-tool-test

  test-centos-stream-9:
    name: CentOS Stream 9 (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    container: quay.io/centos/centos:stream9
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Install system dependencies
        run: |
          dnf install -y \
            gcc gcc-c++ make cmake git \
            python${{ matrix.python-version }} \
            python${{ matrix.python-version }}-devel \
            python${{ matrix.python-version }}-pip \
            libatomic

      - uses: actions/checkout@v4

      - name: Install Python deps
        run: |
          python${{ matrix.python-version }} -m pip install -U -c .github/ci-constraints.txt pip
          python${{ matrix.python-version }} -m pip install -c .github/ci-constraints.txt \
            --build-constraint .github/ci-constraints.txt -e ".[dev]"

      - name: Run CI checks (lint + C++ tests with and without the hooks + Python tests)
        run: PYTHON=python${{ matrix.python-version }} make check-ci

  # The C++ tests with MSVC: a Release build with CMake's link-time optimisation (the wheel's
  # configuration), with and without the private hooks.
  cpp-windows-msvc:
    name: C++ tests (windows, MSVC)
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    env:
      CC: cl
      CXX: cl
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tools
        run: |
          python -m pip install -U -c .github/ci-constraints.txt pip
          python -m pip install -c .github/ci-constraints.txt cmake ninja
      - uses: ilammy/msvc-dev-cmd@v1
      - name: C++ tests, private hooks on
        run: bash dev/cpp-tests.sh release
      - name: C++ tests, private hooks off
        run: bash dev/cpp-tests.sh off

  sanitizers:
    name: C++ tests (ubuntu, ASan + UBSan)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tools
        run: |
          python -m pip install -U -c .github/ci-constraints.txt pip
          python -m pip install -c .github/ci-constraints.txt cmake ninja
      - name: C++ tests under AddressSanitizer and UndefinedBehaviorSanitizer
        run: bash dev/cpp-tests.sh sanitize

  # The generated type stub python/netgraph_core/__init__.pyi (make stubs-check): no drift from a
  # fresh generation out of a wheel of this commit, the stub and py.typed in the wheel and the
  # sdist, and the typed clients of tests/typing (valid: no diagnostic; invalid: exactly the
  # expected ones) under pinned Pyright against the installed wheel and an installation built
  # from the sdist. The script makes its own pinned venvs. Python 3.14: the version the
  # committed stub is generated with.
  stubs:
    name: Type stub and typed clients (ubuntu, py3.14)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Stub drift, package contents, typed clients (wheel and sdist)
        run: PYTHON=python bash dev/stubs/run.sh check

  coverage:
    name: Coverage (ubuntu, py3.11)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # make cov builds its own pinned venv (build/coverage-venv) and fails on any failure.
      - name: Generate coverage (Python + C++)
        run: make cov
      - name: Upload coverage artifacts
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: |
            build/coverage/coverage-python.xml
            build/coverage/coverage-cpp.xml
            build/coverage/coverage-combined.html
