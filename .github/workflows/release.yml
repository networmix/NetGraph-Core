name: Release

on:
  push:
    tags: ["v*"]
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**.md"
  workflow_dispatch:

jobs:
  # A tag push publishes whatever version pyproject.toml declares, so a mistyped
  # tag would ship the wrong version silently. Fail fast instead.
  check_version:
    name: Tag matches project version
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - name: Compare tag with pyproject version
        run: |
          python -c "
          import tomllib, os, sys
          version = tomllib.load(open('pyproject.toml','rb'))['project']['version']
          tag = os.environ['GITHUB_REF_NAME'].removeprefix('v')
          if tag != version:
              sys.exit(f'tag {tag!r} != pyproject version {version!r}')
          print(f'tag matches project version: {version}')
          "

  build_wheels:
    name: Wheel (${{ matrix.os }}, ${{ matrix.cibw_archs }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            cibw_archs: "x86_64"
          - os: ubuntu-22.04-arm
            cibw_archs: "aarch64"
          - os: macos-latest
            cibw_archs: "universal2"
          - os: windows-latest
            cibw_archs: "AMD64"

    steps:
      - uses: actions/checkout@v4

      # Install uv for faster dependency installation (required on macOS, bundled in manylinux).
      # An exact version, like the Python tools of .github/ci-constraints.txt.
      - uses: astral-sh/setup-uv@v4
        with:
          version: "0.11.16"

      # Build wheels using cibuildwheel
      - name: Build wheels
        uses: pypa/cibuildwheel@v3.3.1
        env:
          # Build for Python 3.11+
          CIBW_BUILD: "cp311-* cp312-* cp313-* cp314-* cp314t-*"
          # Skip PyPy, musllinux, and 32-bit Linux
          CIBW_SKIP: "pp* *-musllinux_* *-manylinux_i686"

          # Use uv for faster dependency installation (10-100x faster than pip)
          CIBW_BUILD_FRONTEND: "build[uv]"
          # The pins of .github/ci-constraints.txt for what uv installs without constraints of
          # cibuildwheel's own: the build requirements of every wheel (scikit-build-core and its
          # dependencies; pybind11 is pinned in pyproject.toml) and the test requirements. uv
          # reads UV_CONSTRAINT only when a call passes no -c, so cibuildwheel's own tools keep
          # its pins. Linux builds in a container that holds the project at /project.
          CIBW_ENVIRONMENT_LINUX: "UV_CONSTRAINT=/project/.github/ci-constraints.txt"
          CIBW_ENVIRONMENT_MACOS: UV_CONSTRAINT="$GITHUB_WORKSPACE/.github/ci-constraints.txt"
          CIBW_ENVIRONMENT_WINDOWS: UV_CONSTRAINT="$GITHUB_WORKSPACE/.github/ci-constraints.txt"

          # Target architecture per matrix entry (native compilation, no QEMU)
          CIBW_ARCHS: "${{ matrix.cibw_archs }}"
          # The Python suite on every built wheel (the shipped configuration, hooks off; the
          # free-threaded cp314t wheels included): exactly the tests that need a hook skip.
          # Windows runs pytest without dev/run-checks.sh, after the same check of the hook
          # setting: the wheel lacks the private hooks.
          CIBW_TEST_REQUIRES: "pytest==9.1.1"
          CIBW_TEST_COMMAND: "PYTHON=python bash {project}/dev/run-checks.sh pytest off -p no:cacheprovider"
          CIBW_TEST_COMMAND_WINDOWS: >-
            python -c "import sys, _netgraph_core as m; sys.exit('the wheel carries the private hooks' if hasattr(m, '_fail_native_allocation') else 0)"
            && python -m pytest {project}/tests/py -p no:cacheprovider
          CIBW_BEFORE_ALL_LINUX: "yum install -y libatomic || (apt-get update && apt-get install -y libatomic1) || apk add libatomic"

      - uses: actions/upload-artifact@v4
        with:
          name: cibw-wheels-${{ matrix.os }}-${{ matrix.cibw_archs }}
          path: ./wheelhouse/*.whl

  # build fills its isolated environment with a plain pip install, which PIP_CONSTRAINT reaches;
  # the same variable pins pip itself and build.
  build_sdist:
    name: Build SDist
    runs-on: ubuntu-latest
    env:
      PIP_CONSTRAINT: ${{ github.workspace }}/.github/ci-constraints.txt
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build SDist
        run: |
          python -m pip install -U pip
          python -m pip install build
          python -m build --sdist

      - uses: actions/upload-artifact@v4
        with:
          name: cibw-sdist
          path: dist/*.tar.gz

  # An installation built from the source distribution, tested with the Python suite of the same
  # commit. pip builds it in an isolated environment of its own, which since pip 26.2 takes only
  # build constraints (PIP_BUILD_CONSTRAINT), never PIP_CONSTRAINT: both name the same file.
  # PIP_CONSTRAINT pins the venv's pip itself and pytest.
  test_sdist:
    name: Test an installation built from the SDist
    needs: [build_sdist]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: cibw-sdist
          path: sdist
      - name: Build and install from the SDist
        env:
          PIP_CONSTRAINT: ${{ github.workspace }}/.github/ci-constraints.txt
          PIP_BUILD_CONSTRAINT: ${{ github.workspace }}/.github/ci-constraints.txt
        run: |
          python -m venv "$RUNNER_TEMP/sdist-venv"
          "$RUNNER_TEMP/sdist-venv/bin/python" -m pip install -U pip
          "$RUNNER_TEMP/sdist-venv/bin/python" -m pip install pytest
          "$RUNNER_TEMP/sdist-venv/bin/python" -m pip install -v sdist/*.tar.gz
      - name: Python tests against the installation
        run: PYTHON="$RUNNER_TEMP/sdist-venv/bin/python" bash dev/run-checks.sh pytest off -p no:cacheprovider

  test_wheels_centos_stream_9:
    name: Test wheels (CentOS Stream 9, py${{ matrix.python-version }})
    needs: [build_wheels]
    runs-on: ubuntu-latest
    container: quay.io/centos/centos:stream9
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Install Python
        run: dnf install -y python${{ matrix.python-version }} python${{ matrix.python-version }}-pip

      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: cibw-wheels-ubuntu-*
          path: wheelhouse
          merge-multiple: true

      - name: Install and test wheel
        run: |
          python${{ matrix.python-version }} -m venv /tmp/wheel-venv
          /tmp/wheel-venv/bin/python -m pip install --upgrade -c .github/ci-constraints.txt pip
          /tmp/wheel-venv/bin/python -m pip install -c .github/ci-constraints.txt pytest numpy
          # --no-index: the wheel built above, never a published one of the same version.
          /tmp/wheel-venv/bin/python -m pip install --no-index --find-links wheelhouse/ netgraph-core
          PYTHON=/tmp/wheel-venv/bin/python bash dev/run-checks.sh pytest off -p no:cacheprovider

  publish_pypi:
    name: Publish to PyPI
    needs: [check_version, build_wheels, build_sdist, test_sdist, test_wheels_centos_stream_9]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # Required for Trusted Publishing (OIDC)

    # Only publish on tag pushes
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')

    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: cibw-*
          path: dist
          merge-multiple: true

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
